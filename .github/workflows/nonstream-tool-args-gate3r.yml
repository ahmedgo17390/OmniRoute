# TEMPORARY Gate 3R: reliability-controlled rerun of the 8 Linux unit-test shards on the
# frozen fix commit. Lives only on test/nonstream-tool-args-linux-20261025.
# Each stage runs the exact package.json `test:unit:ci:shard` command with one change made
# at execution time: its single `--test-force-exit` token is replaced by reporter flags
# (spec to stdout, as before, plus a JUnit file for per-file, per-test results). Run
# 40178990614 showed process isolation + --test-force-exit silently drops results.
name: Nonstream Tool Args Gate 3R (no force-exit)

on:
  push:
    branches: [test/nonstream-tool-args-linux-20261025]

concurrency:
  group: nonstream-tool-args-gate3r-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FIX_SHA: 8fd2e261e2a069c637d9f4383cbed8fddc036647
  CI_NODE_MAJOR: "24"
  DISABLE_SQLITE_AUTO_BACKUP: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
  # JUnit -> per-test records (file, suite path > name, status) for one stage.
  JUNIT_PARSER: |
    import { readFileSync } from "node:fs";
    const unx = (s) => s.replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16))).replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(Number(d))).replace(/&amp;/g, "&");
    export function parseJunit(file, root) {
      const xml = readFileSync(file, "utf8");
      const tests = [];
      const stack = [];
      let suites = 0;
      let cur = null;
      // Attribute values may legally contain ">" (e.g. "OpenAI->Claude"), so match quoted values whole.
      const re = /<(\/?)(testsuites|testsuite|testcase|failure|skipped|error)\b((?:[^>"]|"[^"]*")*?)(\/?)>/g;
      for (const m of xml.matchAll(re)) {
        const [, close, tag, attrStr, selfClose] = m;
        const attrs = {};
        for (const a of attrStr.matchAll(/([\w:-]+)="([^"]*)"/g)) attrs[a[1]] = unx(a[2]);
        if (tag === "testsuite") { if (!close) suites++; if (close) stack.pop(); else if (!selfClose) stack.push(attrs.name ?? ""); continue; }
        if (tag === "testcase") {
          if (close) { cur = null; continue; }
          cur = { file: (attrs.file ?? "").split(root).pop().replace(/^\/+/, ""), id: [...stack, attrs.name ?? ""].join(" > "), status: "pass", err: "" };
          tests.push(cur);
          if (selfClose) cur = null;
          continue;
        }
        if (!cur || close) continue;
        if (tag === "skipped") cur.status = attrs.type === "todo" ? "todo" : "skip";
        if (tag === "failure" || tag === "error") {
          const t = attrs.type ?? "";
          cur.status = /testTimeoutFailure/.test(t) ? "timeout" : /cancelledByParent/.test(t) ? "cancelled" : "fail";
          cur.err = (attrs.message ?? "").split("\n")[0].slice(0, 200);
        }
      }
      // A test that has subtests is written as a <testsuite>, not a <testcase>.
      return { tests, suites };
    }

jobs:
  unit-shards:
    name: Gate 3R unit shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Same literal test values as ci.yml test-unit (not repository secrets).
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      TEST_SHARD: ${{ matrix.shard }}/8
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FIX_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.CI_NODE_MAJOR }}
          package-manager-cache: false
      - uses: ./.github/actions/npm-ci-retry
        with:
          cache: "false"
      - name: Gate 0 - toolchain and isolation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FIX_SHA"
          test "${{ runner.environment }}" = "github-hosted"
          node -v; npm -v
          test "$(node -p 'process.versions.node.split(".")[0]')" = "$CI_NODE_MAJOR"
          test "$(npm -v)" = "$(node -p "require('./config/ci/toolchain.json').npm")"
          test -z "${DATA_DIR+x}" && test -z "${OMNIROUTE_ALLOW_DEFAULT_DATA_DIR+x}"
          npm run check:node-runtime
          mkdir -p out
          { echo "node=$(node -v)"; echo "npm=$(npm -v)"; echo "sha=$(git rev-parse HEAD)"; echo "shard=$TEST_SHARD"; } > out/toolchain.txt
      - name: Derive stage commands (only --test-force-exit removed)
        run: |
          node -e '
            const fs = require("fs");
            const parts = require("./package.json").scripts["test:unit:ci:shard"].split(" && ");
            if (parts.length !== 3) { console.error("expected 3 stages, got " + parts.length); process.exit(1); }
            parts.forEach((orig, i) => {
              const n = i + 1;
              const pieces = orig.split(" --test-force-exit");
              if (pieces.length !== 2) { console.error(`stage ${n}: expected exactly one --test-force-exit, found ${pieces.length - 1}`); process.exit(1); }
              const cmd = pieces.join(` --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=out/stage${n}.junit.xml`);
              if (cmd.includes("--test-force-exit")) process.exit(1);
              fs.writeFileSync(`out/stage${n}.original.cmd`, orig);
              fs.writeFileSync(`out/stage${n}.cmd`, cmd);
              console.log(`stage ${n}: ${cmd}`);
            });'
      - name: Write JUnit parser
        run: printf '%s' "$JUNIT_PARSER" > "$RUNNER_TEMP/junit.mjs"
      - name: Run all three stages (bounded; every stage runs even if one fails)
        run: |
          limits=(2700 900 900)
          for i in 1 2 3; do
            start=$(date +%s)
            set +e
            PATH="$PWD/node_modules/.bin:$PATH" timeout -k 30 "${limits[$((i - 1))]}" bash -c "$(cat "out/stage$i.cmd")" > "out/stage$i.log" 2>&1 < /dev/null
            rc=$?
            set -e
            printf '%s\t%s\t%s\n' "$i" "$rc" "$(( $(date +%s) - start ))" >> out/stages.tsv
            # -a: test output can contain NUL bytes (GNU grep would otherwise print only
            # "binary file matches" and the summary would silently come out empty).
            grep -aE '^ℹ (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms) ' "out/stage$i.log" | tail -8 > "out/stage$i.summary" || true
            echo "::group::stage $i rc=$rc ($(( $(date +%s) - start ))s)"
            cat "out/stage$i.summary"
            awk '/failing tests:/{f=1} f' "out/stage$i.log" | grep -avE '^\s+at ' | head -300
            echo "::endgroup::"
          done
          cat out/stages.tsv
      - name: Per-stage results and consistency checks
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync, existsSync } from 'node:fs';
            const { parseJunit } = await import('$RUNNER_TEMP/junit.mjs');
            const root = process.cwd() + '/';
            const stages = readFileSync('out/stages.tsv', 'utf8').trim().split('\n').map((l) => l.split('\t'));
            let bad = 0;
            for (const [i, rc, secs] of stages) {
              const summary = {};
              for (const l of readFileSync('out/stage' + i + '.summary', 'utf8').split('\n')) { const m = l.match(/^ℹ (\w+) ([\d.]+)$/); if (m) summary[m[1]] = Number(m[2]); }
              const problems = [];
              if (rc === '124' || rc === '137') problems.push('TIMEOUT (stage did not terminate within its limit)');
              if (!('tests' in summary)) problems.push('missing runner summary');
              const jf = 'out/stage' + i + '.junit.xml';
              let tests = [], jsuites = 0;
              if (!existsSync(jf)) problems.push('missing JUnit file');
              else { try { ({ tests, suites: jsuites } = parseJunit(jf, root)); } catch (e) { problems.push('malformed JUnit: ' + e.message); } }
              const c = (s) => tests.filter((t) => t.status === s).length;
              let parentTests = null;
              if ('tests' in summary) {
                // Tests with subtests appear as extra JUnit testsuites: testcases + (JUnit suites - runner
                // suites) must equal runner tests, and the per-status gaps must be >= 0 and add up to it.
                parentTests = jsuites - summary.suites;
                const gaps = { pass: summary.pass - c('pass'), fail: summary.fail - c('fail') - c('timeout'), cancelled: summary.cancelled - c('cancelled'), skipped: summary.skipped - c('skip'), todo: summary.todo - c('todo') };
                const gapSum = Object.values(gaps).reduce((a, b) => a + b, 0);
                if (parentTests < 0 || tests.length + parentTests !== summary.tests) problems.push('JUnit testcases ' + tests.length + ' + parent tests ' + parentTests + ' != summary tests ' + summary.tests);
                if (Object.values(gaps).some((g) => g < 0) || gapSum !== parentTests) problems.push('per-status JUnit/summary mismatch ' + JSON.stringify(gaps) + ' vs parent tests ' + parentTests);
              }
              if (tests.some((t) => !t.file)) problems.push(tests.filter((t) => !t.file).length + ' testcases without a file attribute');
              const keys = new Map();
              for (const t of tests) { const k = t.file + ' :: ' + t.id; keys.set(k, (keys.get(k) ?? 0) + 1); }
              const duplicates = [...keys].filter(([, n]) => n > 1).map(([k, n]) => ({ key: k, count: n }));
              const out = { stage: Number(i), rc: Number(rc), secs: Number(secs), summary, junitSuites: jsuites, parentTests, problems, duplicates, tests };
              writeFileSync('out/stage' + i + '.results.json', JSON.stringify(out));
              console.log('stage ' + i + ' rc=' + rc + ' ' + JSON.stringify(summary) + ' junit=' + tests.length + ' parentTests=' + parentTests + ' files=' + new Set(tests.map((t) => t.file)).size + ' duplicates=' + duplicates.length + ' problems=' + JSON.stringify(problems));
              if (problems.length) bad = 1;
            }
            process.exit(bad);"
      - name: Shard verdict
        run: |
          cat out/stages.tsv
          awk -F'\t' '$2 != 0 {bad=1} END {exit bad}' out/stages.tsv
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate3r-unit-shard-${{ matrix.shard }}
          path: out/
          if-no-files-found: error

  gate3r-summary:
    name: Gate 3R summary (verified baseline failures, completeness)
    needs: unit-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: gate3r-unit-shard-*
          path: gate3r
      - name: Aggregate, classify and verify completeness
        run: |
          cat > summarize.mjs <<'EOF'
          import { readFileSync, existsSync, writeFileSync, appendFileSync } from "node:fs";
          // Failures with matched-baseline evidence on Linux (run 40175740006, Gate 2: both refs fail identically).
          const KNOWN = new Set([
            "tests/unit/cli-env-quality-docs-mirrors.test.ts :: CodeBuddy rows preserve the opt-in cap and replacement provenance in every locale",
            "tests/unit/resilience-pre-dispatch-docs-mirrors.test.ts :: every resilience mirror includes the pre-dispatch retry and terminal contracts",
          ]);
          // Exact per-file test counts established in run 40178990614 (process isolation
          // without --test-force-exit, 20/20 identical repetitions per file).
          const EXPECTED = {
            "tests/unit/reasoning-cache.test.ts": 60, "tests/unit/specificity-rules.test.ts": 64,
            "tests/unit/path-literal-edges.test.ts": 48, "tests/unit/build/check-licenses.test.ts": 36,
            "tests/unit/plan3-p0.test.ts": 38, "tests/unit/streamingPiiTransform.test.ts": 28,
            "tests/unit/authz/classify.test.ts": 52, "tests/unit/muse-code-device-hardening-15869.test.ts": 36,
            "tests/unit/admission-verdict.test.mjs": 31, "tests/unit/translator-openai-to-gemini.test.ts": 50,
            "tests/unit/executor-claude-identity.test.ts": 32, "tests/unit/combo-task-aware.test.ts": 35,
            "tests/unit/claude-code-parity.test.ts": 40,
          };
          const STAGES = ["main", "dashboard", "serial"];
          const rows = [], failures = [], infra = [], dups = [];
          const total = { tests: 0, pass: 0, fail: 0, cancelled: 0, skipped: 0, todo: 0 };
          const perFile = new Map();
          for (let s = 1; s <= 8; s++) {
            for (let i = 1; i <= 3; i++) {
              const p = `gate3r/gate3r-unit-shard-${s}/stage${i}.results.json`;
              const where = `${s}/8 ${STAGES[i - 1]}`;
              if (!existsSync(p)) { infra.push(`${where}: no results (job did not complete)`); rows.push(`| ${where} | — | — | — | — | — | — | — | — |`); continue; }
              const r = JSON.parse(readFileSync(p, "utf8"));
              for (const pr of r.problems) infra.push(`${where}: ${pr}`);
              for (const d of r.duplicates) dups.push(`${where}: ${d.key} ×${d.count}`);
              for (const k of Object.keys(total)) total[k] += r.summary[k] ?? 0;
              const sm = r.summary;
              rows.push(`| ${where} | ${r.rc} | ${r.secs}s | ${sm.tests ?? "—"} | ${sm.pass ?? "—"} | ${sm.fail ?? "—"} | ${sm.cancelled ?? "—"} | ${sm.skipped ?? "—"} | ${sm.todo ?? "—"} |`);
              for (const t of r.tests) {
                const file = t.file.replace(/^.*?(tests\/unit\/)/, "$1"); // repo-relative regardless of checkout root
                perFile.set(file, (perFile.get(file) ?? 0) + 1);
                if (t.status === "fail" || t.status === "timeout" || t.status === "cancelled") {
                  const leaf = t.id.split(" > ").pop();
                  const key = `${file} :: ${leaf}`;
                  failures.push({ where, key, id: t.id, status: t.status, err: t.err, cls: KNOWN.has(key) ? "VERIFIED-BASELINE" : "UNEXPECTED" });
                }
              }
            }
          }
          const completeness = Object.entries(EXPECTED).map(([f, n]) => ({ f, n, got: perFile.get(f) ?? 0 }));
          for (const c of completeness) if (c.got !== c.n) infra.push(`completeness: ${c.f} reported ${c.got}, expected ${c.n}`);
          const knownSeen = new Set(failures.filter((f) => f.cls === "VERIFIED-BASELINE").map((f) => f.key));
          for (const k of KNOWN) if (!knownSeen.has(k)) infra.push(`known baseline failure not observed as a failure: ${k}`);
          const unexpected = failures.filter((f) => f.cls === "UNEXPECTED");
          const verdict = infra.length ? "INCONCLUSIVE" : unexpected.length ? "FAIL" : failures.length ? "PASS WITH VERIFIED BASELINE FAILURES" : "FULL-SUITE PASS";
          const md = [
            `## Gate 3R verdict: ${verdict}`, ``, `Unit total: ${JSON.stringify(total)} — files with results: ${perFile.size}`, ``,
            `| shard / stage | rc | time | tests | pass | fail | cancelled | skipped | todo |`, `|---|---|---|---|---|---|---|---|---|`, ...rows, ``,
            `### Completeness of the previously affected files`, `| file | expected | reported |`, `|---|---|---|`,
            ...completeness.map((c) => `| ${c.f.replace("tests/unit/", "")} | ${c.n} | ${c.got}${c.got === c.n ? "" : " ⚠"} |`), ``,
            `### Failures (${failures.length}: ${failures.length - unexpected.length} verified-baseline, ${unexpected.length} unexpected)`,
            ...failures.map((f) => `- [${f.cls}] ${f.where} — ${f.key} — ${f.status} — ${f.err}`), ``,
            `### Duplicate identities within a stage (${dups.length})`, ...dups.slice(0, 50).map((d) => `- ${d}`), ``,
            `### Infrastructure / completeness problems (${infra.length})`, ...infra.map((i) => `- ${i}`),
          ].join("\n");
          writeFileSync("gate3r-summary.md", md);
          writeFileSync("gate3r-summary.json", JSON.stringify({ verdict, total, failures, infra, dups, completeness, filesWithResults: perFile.size }, null, 1));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          console.log(md);
          EOF
          node summarize.mjs
      - name: Upload Gate 3R summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate3r-summary
          path: gate3r-summary.*
          if-no-files-found: warn
