# TEMPORARY Phase B: targeted recovery of Gate 3R stage 1 (main) for shards 1, 2, 3 and 7 on
# the frozen fix commit. Lives only on test/nonstream-tool-args-linux-20261025.
# Phase A (run 40188448796) showed each shard is blocked by one file that completes all its
# tests and then keeps its process alive (open intervals/timeouts, fs watchers, an ioredis
# reconnect loop). Per shard:
#   1. the shard's file list is computed exactly as node --test selects it (bash expansion of
#      the package.json arguments, internal glob excluding node_modules, sort, index % 8),
#      a method that matched shards 4, 5, 6 and 8 of run 40182562808 file for file;
#   2. every file except the named blocker runs in ONE invocation of the original stage
#      command with --test-force-exit removed, --test-shard and the patterns replaced by that
#      explicit list (same order, concurrency, imports, isolation);
#   3. the named blocker alone runs the original command (with --test-force-exit) and is
#      accepted only if its reported test identities and statuses equal the Phase A
#      expected set exactly (up to 5 recorded attempts).
# A matched job checks the late-async failure seen in noauth-pause-visibility on both refs.
name: Nonstream Tool Args Phase B Shard Recovery

# Parked after run 40189763018 (workflow_dispatch only; not on the default branch, so it
# cannot start). Restore the push trigger below to re-run Phase B.
#   push:
#     branches: [test/nonstream-tool-args-linux-20261025]
on:
  workflow_dispatch:

concurrency:
  group: nonstream-tool-args-recovery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FIX_SHA: 8fd2e261e2a069c637d9f4383cbed8fddc036647
  BASE_SHA: d851a09f97de12c0eac699068e108e8a61156914
  CI_NODE_MAJOR: "24"
  DISABLE_SQLITE_AUTO_BACKUP: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
  # Same literal test values as ci.yml test-unit (not repository secrets).
  JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
  API_KEY_SECRET: ci-test-api-key-secret-long
  NODE_OPTIONS: --max-old-space-size=8192
  # Exact identities and statuses of the named blockers: identical across the plain and
  # instrumented no-force-exit runs and 5 force-exit runs of run 40188448796, and equal to
  # each file's literal test titles.
  EXCEPTION_EXPECTED: |
    {"tests/unit/proxy-health-recovery-pass.test.ts":[{"id":"success ends the set-aside: the proxy is no longer avoided","status":"pass"},{"id":"refusal re-records the set-aside with the existing doubling","status":"pass"},{"id":"flag off (default): no probe runs","status":"pass"},{"id":"the injected probe receives the egress key string (no id-object mismatch)","status":"pass"}],
     "tests/unit/daily-reset-tz-threading.test.ts":[{"id":"checkFallbackError: Paris pre-spring-forward resolves to provider midnight","status":"pass"},{"id":"checkFallbackError: Paris pre-fall-back resolves to provider midnight","status":"pass"},{"id":"checkFallbackError: New York resolves to provider midnight, not host midnight","status":"pass"},{"id":"checkFallbackError: unconfigured clock keeps the legacy host-midnight value","status":"pass"},{"id":"checkFallbackError: invalid timezone falls back to legacy without throwing","status":"pass"},{"id":"resolveComboDailyReset: matches id and prefix, null for unknown providers","status":"pass"},{"id":"round-robin combo passes the node clock, and a timezone edit applies without restart","status":"pass"},{"id":"priority combo attempt path passes the node clock to checkFallbackError","status":"pass"}],
     "tests/unit/next-macos-typescript-config.test.mjs":[{"id":"macOS development loads TypeScript configuration without spawning the CLI","status":"pass"},{"id":"worker thread workaround is limited to macOS development","status":"pass"}],
     "tests/unit/quota-redis-store.test.ts":[{"id":"redisQuotaStore: consume calls INCRBYFLOAT + EXPIRE and returns sliding window value","status":"pass"},{"id":"redisQuotaStore: getRedisClient throws clear error if ioredis not installed","status":"pass"},{"id":"redisQuotaStore: real Redis integration (skipped unless RUN_QUOTA_REDIS_INT=1)","status":"skip"},{"id":"redisQuotaStore: sliding window decay formula is correct","status":"pass"},{"id":"redisQuotaStore: resetRedisQuotaStore resets the store singleton","status":"pass"},{"id":"redis namespace prefix: quota store KEY_PREFIX derives from REDIS_KEY_PREFIX","status":"pass"}]}
  TAP_PARSER: |
    import { readFileSync } from "node:fs";
    const unesc = (s) => s.replace(/\\#/g, "#").replace(/\\\\/g, "\\");
    export function parseTap(file) {
      const lines = readFileSync(file, "utf8").split("\n");
      const stack = [];
      const tests = [];
      const summary = {};
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const sub = line.match(/^( *)# Subtest: (.*)$/);
        if (sub) { const lvl = sub[1].length / 4; stack.length = lvl; stack[lvl] = unesc(sub[2]); continue; }
        const sm = line.match(/^# (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms) ([\d.]+)$/);
        if (sm) { summary[sm[1]] = Number(sm[2]); continue; }
        const r = line.match(/^( *)(ok|not ok) \d+ - (.*?)(?: # (SKIP|TODO)\b.*)?$/);
        if (!r) continue;
        const lvl = r[1].length / 4;
        const name = unesc(r[3]);
        const meta = {};
        if ((lines[i + 1] ?? "").trim() === "---") {
          const pad = r[1] + "  ";
          let j = i + 2;
          for (; j < lines.length && lines[j] !== pad + "..."; j++) {
            const kv = lines[j].match(/^ *(type|failureType|error|code): ?(.*)$/);
            if (!kv || !lines[j].startsWith(pad) || lines[j].startsWith(pad + " ")) continue;
            let v = kv[2];
            if (v === "|-" || v === "|" || v === ">-") {
              const body = [];
              while (j + 1 < lines.length && lines[j + 1].startsWith(pad + "  ")) body.push(lines[++j].trim());
              v = body.join("\n");
            } else v = v.replace(/^'(.*)'$/, "$1").replace(/''/g, "'");
            meta[kv[1]] = v;
          }
          i = j;
        }
        if (meta.type === "suite") continue;
        let status = r[2] === "ok" ? (r[4] ? r[4].toLowerCase() : "pass") : "fail";
        if (status === "fail" && meta.failureType === "testTimeoutFailure") status = "timeout";
        if (status === "fail" && meta.failureType === "cancelledByParent") status = "cancelled";
        tests.push({ id: [...stack.slice(0, lvl), name].join(" > "), status, err: (meta.error ?? "").split("\n")[0].slice(0, 200) });
      }
      return { tests, summary: Object.keys(summary).length ? summary : null };
    }
  # JUnit -> per-test records (same parser as Gate 3R: quoted attribute values may contain ">",
  # and a test with subtests is written as a <testsuite>).
  JUNIT_PARSER: |
    import { readFileSync } from "node:fs";
    const unx = (s) => s.replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16))).replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(Number(d))).replace(/&amp;/g, "&");
    export function parseJunit(file, root) {
      const xml = readFileSync(file, "utf8");
      const tests = [];
      const stack = [];
      let suites = 0;
      let cur = null;
      const re = /<(\/?)(testsuites|testsuite|testcase|failure|skipped|error)\b((?:[^>"]|"[^"]*")*?)(\/?)>/g;
      for (const m of xml.matchAll(re)) {
        const [, close, tag, attrStr, selfClose] = m;
        const attrs = {};
        for (const a of attrStr.matchAll(/([\w:-]+)="([^"]*)"/g)) attrs[a[1]] = unx(a[2]);
        if (tag === "testsuite") { if (!close) suites++; if (close) stack.pop(); else if (!selfClose) stack.push(attrs.name ?? ""); continue; }
        if (tag === "testcase") {
          if (close) { cur = null; continue; }
          cur = { file: (attrs.file ?? "").split(root).pop().replace(/^\/+/, ""), id: [...stack, attrs.name ?? ""].join(" > "), status: "pass", err: "" };
          tests.push(cur);
          if (selfClose) cur = null;
          continue;
        }
        if (!cur || close) continue;
        if (tag === "skipped") cur.status = attrs.type === "todo" ? "todo" : "skip";
        if (tag === "failure" || tag === "error") {
          const t = attrs.type ?? "";
          cur.status = /testTimeoutFailure/.test(t) ? "timeout" : /cancelledByParent/.test(t) ? "cancelled" : "fail";
          cur.err = (attrs.message ?? "").split("\n")[0].slice(0, 200);
        }
      }
      return { tests, suites };
    }

jobs:
  recover:
    name: Phase B shard ${{ matrix.shard }}/8 stage 1 (exception ${{ matrix.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            slug: proxy-health-recovery-pass
            exception: tests/unit/proxy-health-recovery-pass.test.ts
          - shard: 2
            slug: daily-reset-tz-threading
            exception: tests/unit/daily-reset-tz-threading.test.ts
          - shard: 3
            slug: next-macos-typescript-config
            exception: tests/unit/next-macos-typescript-config.test.mjs
          - shard: 7
            slug: quota-redis-store
            exception: tests/unit/quota-redis-store.test.ts
    env:
      SHARD: ${{ matrix.shard }}
      EXCEPTION: ${{ matrix.exception }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FIX_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.CI_NODE_MAJOR }}
          package-manager-cache: false
      - uses: ./.github/actions/npm-ci-retry
        with:
          cache: "false"
      - name: Gate 0 - toolchain and isolation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FIX_SHA"
          test "${{ runner.environment }}" = "github-hosted"
          node -v; npm -v
          test "$(node -p 'process.versions.node.split(".")[0]')" = "$CI_NODE_MAJOR"
          test "$(npm -v)" = "$(node -p "require('./config/ci/toolchain.json').npm")"
          test -z "${DATA_DIR+x}" && test -z "${OMNIROUTE_ALLOW_DEFAULT_DATA_DIR+x}"
          npm run check:node-runtime
          mkdir -p out
          { echo "node=$(node -v)"; echo "npm=$(npm -v)"; echo "sha=$(git rev-parse HEAD)"; echo "shard=$SHARD/8"; echo "exception=$EXCEPTION"; } > out/toolchain.txt
      - name: Write helpers
        run: |
          printf '%s' "$TAP_PARSER" > "$RUNNER_TEMP/tap.mjs"
          printf '%s' "$JUNIT_PARSER" > "$RUNNER_TEMP/junit.mjs"
      - name: Select the shard's files and build the commands
        run: |
          set -euo pipefail
          node -e 'require("fs").writeFileSync("out/stage1.original.cmd", require("./package.json").scripts["test:unit:ci:shard"].split(" && ")[0])'
          node - <<'EOF'
          const fs = require("fs");
          const cmd = fs.readFileSync("out/stage1.original.cmd", "utf8");
          const once = (s, what) => { const n = cmd.split(what).length - 1; if (n !== 1) { console.error(`expected exactly one ${JSON.stringify(what)}, found ${n}`); process.exit(1); } };
          once(" --test-force-exit", " --test-force-exit"); once(" --test-shard=$TEST_SHARD ", " --test-shard=$TEST_SHARD ");
          const [prefix, args] = cmd.split(" --test-shard=$TEST_SHARD ");
          fs.writeFileSync("out/stage1.prefix", prefix);
          fs.writeFileSync("out/stage1.args", args);
          EOF
          # Let bash parse and expand the positional arguments exactly as `npm run` would.
          bash -c "printf '%s\n' $(cat out/stage1.args)" > out/stage1.expanded-args.txt
          node --input-type=module - <<'EOF'
          import { globSync, readFileSync, writeFileSync } from "node:fs";
          const args = readFileSync("out/stage1.expanded-args.txt", "utf8").split("\n").filter(Boolean);
          const files = [];
          for (const a of args) {
            if (/[*?{}[\]]/.test(a)) files.push(...globSync(a, { cwd: process.cwd(), exclude: (name) => name === "node_modules" }));
            else files.push(a);
          }
          files.sort(); // node's createTestFileList: internal glob, exclude node_modules, sort
          const shard = Number(process.env.SHARD);
          const mine = files.filter((_, i) => i % 8 === shard - 1); // --test-shard index filter
          if (!mine.includes(process.env.EXCEPTION)) { console.error(`exception ${process.env.EXCEPTION} is not in shard ${shard}`); process.exit(1); }
          // Explicit paths are passed back to node --test as patterns: a name with glob
          // metacharacters or quotes would not select exactly itself, so refuse it.
          const unsafe = mine.filter((f) => /[*?{}[\]'"\\]/.test(f));
          if (unsafe.length) { console.error("file names unsafe as literal patterns: " + unsafe.join(", ")); process.exit(1); }
          writeFileSync("out/shard.lst", mine.join("\n") + "\n");
          writeFileSync("out/main.lst", mine.filter((f) => f !== process.env.EXCEPTION).join("\n") + "\n");
          console.log(`discovered ${files.length} files; shard ${shard}: ${mine.length} files; main run ${mine.length - 1}; exception ${process.env.EXCEPTION}`);
          const prefix = readFileSync("out/stage1.prefix", "utf8");
          const main = prefix.replace(" --test-force-exit", " --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=out/main.junit.xml");
          if (main.includes("--test-force-exit") || main === prefix) process.exit(1);
          writeFileSync("out/main.cmd", main + " " + mine.filter((f) => f !== process.env.EXCEPTION).map((f) => `'${f}'`).join(" "));
          const exc = prefix.replace(" --test ", " --test --test-reporter=tap --test-reporter-destination=stdout ");
          if (exc === prefix || !exc.includes("--test-force-exit")) process.exit(1);
          writeFileSync("out/exception.cmd", exc + ` '${process.env.EXCEPTION}'`);
          EOF
          echo "main:      $(cut -c1-260 out/main.cmd) …"
          echo "exception: $(cat out/exception.cmd)"
      - name: Main run - all shard files except the named blocker, no force-exit (bounded)
        run: |
          set +e
          start=$(date +%s)
          PATH="$PWD/node_modules/.bin:$PATH" timeout -k 30 2700 bash -c "$(cat out/main.cmd)" > out/main.log 2>&1 < /dev/null
          rc=$?
          printf 'main\t%s\t%s\n' "$rc" "$(( $(date +%s) - start ))" | tee out/main.rc.tsv
          grep -aE '^ℹ (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms) ' out/main.log | tail -8 > out/main.summary
          cat out/main.summary
          awk '/failing tests:/{f=1} f' out/main.log | grep -avE '^\s+at ' | head -200
          exit 0
      - name: Named exception - blocker alone with the original flags, verified per test
        run: |
          set +e
          for i in 1 2 3 4 5; do
            start=$(date +%s)
            PATH="$PWD/node_modules/.bin:$PATH" timeout -k 15 300 bash -c "$(cat out/exception.cmd)" > "out/exception-$i.tap" 2> "out/exception-$i.err" < /dev/null
            rc=$?
            printf 'exception-%s\t%s\t%s\n' "$i" "$rc" "$(( $(date +%s) - start ))" | tee -a out/exception.rc.tsv
            node --input-type=module -e "
              const { parseTap } = await import('$RUNNER_TEMP/tap.mjs');
              const exp = JSON.parse(process.env.EXCEPTION_EXPECTED)[process.env.EXCEPTION];
              const got = parseTap('out/exception-$i.tap');
              const same = got.summary && got.tests.length === exp.length && exp.every((e, k) => got.tests[k]?.id === e.id && got.tests[k]?.status === e.status);
              console.log('attempt $i: reported ' + got.tests.length + '/' + exp.length + ', summary ' + JSON.stringify(got.summary) + ', exact identity+status match: ' + !!same);
              process.exit(same ? 0 : 1);" && { echo "accepted attempt $i"; echo "$i" > out/exception.accepted; break; }
          done
          exit 0
      - name: Per-shard results and consistency checks
        run: |
          node --input-type=module - <<'EOF'
          import { readFileSync, writeFileSync, existsSync } from "node:fs";
          const { parseJunit } = await import(`${process.env.RUNNER_TEMP}/junit.mjs`);
          const { parseTap } = await import(`${process.env.RUNNER_TEMP}/tap.mjs`);
          const [, rc, secs] = readFileSync("out/main.rc.tsv", "utf8").trim().split("\t");
          const summary = {};
          for (const l of readFileSync("out/main.summary", "utf8").split("\n")) { const m = l.match(/^ℹ (\w+) ([\d.]+)$/); if (m) summary[m[1]] = Number(m[2]); }
          const problems = [];
          if (rc === "124" || rc === "137") problems.push("main run TIMEOUT (did not terminate within its limit)");
          if (!("tests" in summary)) problems.push("main run: missing runner summary");
          let tests = [], jsuites = 0;
          if (!existsSync("out/main.junit.xml")) problems.push("main run: missing JUnit file");
          else { try { ({ tests, suites: jsuites } = parseJunit("out/main.junit.xml", process.cwd() + "/")); } catch (e) { problems.push("main run: malformed JUnit: " + e.message); } }
          const c = (s) => tests.filter((t) => t.status === s).length;
          let parentTests = null;
          if ("tests" in summary) {
            parentTests = jsuites - summary.suites;
            const gaps = { pass: summary.pass - c("pass"), fail: summary.fail - c("fail") - c("timeout"), cancelled: summary.cancelled - c("cancelled"), skipped: summary.skipped - c("skip"), todo: summary.todo - c("todo") };
            const gapSum = Object.values(gaps).reduce((a, b) => a + b, 0);
            if (parentTests < 0 || tests.length + parentTests !== summary.tests) problems.push(`main run: JUnit testcases ${tests.length} + parent tests ${parentTests} != summary tests ${summary.tests}`);
            if (Object.values(gaps).some((g) => g < 0) || gapSum !== parentTests) problems.push(`main run: per-status JUnit/summary mismatch ${JSON.stringify(gaps)} vs parent tests ${parentTests}`);
          }
          if (tests.some((t) => !t.file)) problems.push(`main run: ${tests.filter((t) => !t.file).length} testcases without a file attribute`);
          const keys = new Map();
          for (const t of tests) { const k = `${t.file} :: ${t.id}`; keys.set(k, (keys.get(k) ?? 0) + 1); }
          const duplicates = [...keys].filter(([, n]) => n > 1).map(([key, count]) => ({ key, count }));
          const accepted = existsSync("out/exception.accepted") ? Number(readFileSync("out/exception.accepted", "utf8")) : null;
          const attempts = readFileSync("out/exception.rc.tsv", "utf8").trim().split("\n").map((l) => l.split("\t"));
          if (accepted === null) problems.push(`exception ${process.env.EXCEPTION}: no attempt reported exactly the expected identities and statuses (${attempts.length} attempts)`);
          const exceptionTests = accepted ? parseTap(`out/exception-${accepted}.tap`).tests.map((t) => ({ file: process.env.EXCEPTION, id: t.id, status: t.status, err: t.err })) : [];
          const out = { shard: Number(process.env.SHARD), exception: process.env.EXCEPTION, main: { rc: Number(rc), secs: Number(secs), summary, junitSuites: jsuites, parentTests, duplicates, tests }, exceptionAttempts: attempts, exceptionAccepted: accepted, exceptionTests, problems };
          writeFileSync("out/recovery.results.json", JSON.stringify(out));
          console.log(`shard ${process.env.SHARD}: main rc=${rc} ${JSON.stringify(summary)} junit=${tests.length} parentTests=${parentTests} files=${new Set(tests.map((t) => t.file)).size} duplicates=${duplicates.length}; exception accepted attempt ${accepted} of ${attempts.length}; problems=${JSON.stringify(problems)}`);
          process.exit(problems.length ? 1 : 0);
          EOF
      - name: Upload shard recovery results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-shard-${{ matrix.shard }}
          path: out/
          if-no-files-found: error

  noauth-late-async:
    name: Matched check - noauth-pause-visibility without force-exit (${{ matrix.side }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: baseline
            sha: d851a09f97de12c0eac699068e108e8a61156914
          - side: candidate
            sha: 8fd2e261e2a069c637d9f4383cbed8fddc036647
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.CI_NODE_MAJOR }}
          package-manager-cache: false
      - uses: ./.github/actions/npm-ci-retry
        with:
          cache: "false"
      - name: Gate 0 - toolchain and isolation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          test "${{ runner.environment }}" = "github-hosted"
          test "$(node -p 'process.versions.node.split(".")[0]')" = "$CI_NODE_MAJOR"
          test "$(npm -v)" = "$(node -p "require('./config/ci/toolchain.json').npm")"
          test -z "${DATA_DIR+x}" && test -z "${OMNIROUTE_ALLOW_DEFAULT_DATA_DIR+x}"
          mkdir -p out
          { echo "node=$(node -v)"; echo "npm=$(npm -v)"; echo "sha=$(git rev-parse HEAD)"; echo "side=${{ matrix.side }}"; } > out/toolchain.txt
      - name: Alone x3 and in its Phase A group (no force-exit, bounded)
        run: |
          set +e
          B="node --max-old-space-size=8192 --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --test --test-reporter=tap"
          F=tests/unit/noauth-pause-visibility.test.ts
          for i in 1 2 3; do timeout -k 15 180 $B --test-concurrency=1 "$F" > "out/alone-$i.tap" 2>&1 < /dev/null; printf 'alone-%s\t%s\n' "$i" "$?" | tee -a out/rc.tsv; done
          timeout -k 15 300 $B --test-concurrency=4 tests/unit/no-src-open-sse-alias.test.ts tests/unit/noauth-blocked-partition-5183.test.ts "$F" tests/unit/non-streaming-client-translate.test.ts tests/unit/normalize-base-path.test.ts tests/unit/notrack-web-catalog-docs.test.ts tests/unit/numeric-helpers.test.ts > out/group.tap 2>&1 < /dev/null
          printf 'group\t%s\n' "$?" | tee -a out/rc.tsv
          for t in out/*.tap; do echo "$t: late-async=$(grep -ac 'generated asynchronous activity after the test ended' "$t") window-undefined=$(grep -ac 'window is not defined' "$t") $(grep -aE '^# (tests|pass|fail) ' "$t" | tr '\n' ' ')"; done | tee out/signals.txt
          exit 0
      - name: Upload matched check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noauth-${{ matrix.side }}
          path: out/
          if-no-files-found: error
